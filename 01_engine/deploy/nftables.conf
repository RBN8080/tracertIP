#!/usr/sbin/nft -f
# tracertIP node firewall. Input closed except what is listed; output open:
# it is a measuring node. It carries on the Phase 0 rules (00_verification/
# node/nftables.conf, step 0.0, kept as it ran) and adds the live view's
# port for the LAN only (Phase 2).
# LAN4 holds a documentation value (RFC 5737): on deploy, the "define LAN4"
# line is replaced with the installation's (00_verification/node/red.nft.example).
flush ruleset

define LAN4 = 192.0.2.0/24

table inet filtro {
    chain entrada {
        type filter hook input priority filter; policy drop;

        ct state established,related accept comment "replies to what the node started, the probes' ICMP included"
        ct state invalid drop
        iif "lo" accept

        udp sport 67 udp dport 68 accept comment "DHCPv4 client"
        ip6 saddr fe80::/10 udp sport 547 udp dport 546 accept comment "DHCPv6 client"

        icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem } accept comment "RFC 4890"
        icmpv6 type { nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } ip6 hoplimit 255 accept comment "ND, RFC 4861"
        ip6 saddr fe80::/10 icmpv6 type { 130, 131, 132, 143 } accept comment "MLD on the link"
        ip6 saddr fe80::/10 icmpv6 type echo-request limit rate 5/second accept

        ip saddr $LAN4 icmp type echo-request limit rate 5/second accept

        ip saddr $LAN4 tcp dport 22 ct state new accept comment "SSH from the LAN"
        ip6 saddr fe80::/10 tcp dport 22 ct state new accept comment "fallback SSH over link-local"

        ip saddr $LAN4 tcp dport 8080 ct state new accept comment "tracertip live view, LAN only (Phase 2)"
    }

    chain reenvio {
        type filter hook forward priority filter; policy drop;
    }

    chain salida {
        type filter hook output priority filter; policy accept;
    }
}
