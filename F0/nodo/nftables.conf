#!/usr/sbin/nft -f
# tracertIP - nodo - cortafuegos (paso 0.0)
# Entrada cerrada salvo lo listado. Salida abierta: es un nodo de medicion.
# LAN4 lleva un valor de documentacion (RFC 5737). Al desplegar, la linea
# "define LAN4" se sustituye por la de la instalacion (ver red.nft.example).
flush ruleset

define LAN4 = 192.0.2.0/24

table inet filtro {
    chain entrada {
        type filter hook input priority filter; policy drop;

        ct state established,related accept comment "respuestas a lo que el nodo inicio, incluidos los ICMP de las sondas"
        ct state invalid drop
        iif "lo" accept

        udp sport 67 udp dport 68 accept comment "DHCPv4 cliente"
        ip6 saddr fe80::/10 udp sport 547 udp dport 546 accept comment "DHCPv6 cliente"

        icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem } accept comment "RFC 4890"
        icmpv6 type { nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } ip6 hoplimit 255 accept comment "ND, RFC 4861"
        ip6 saddr fe80::/10 icmpv6 type { 130, 131, 132, 143 } accept comment "MLD en el enlace"
        ip6 saddr fe80::/10 icmpv6 type echo-request limit rate 5/second accept

        ip saddr $LAN4 icmp type echo-request limit rate 5/second accept

        ip saddr $LAN4 tcp dport 22 ct state new accept comment "SSH desde la LAN"
        ip6 saddr fe80::/10 tcp dport 22 ct state new accept comment "SSH de respaldo por enlace local"
    }

    chain reenvio {
        type filter hook forward priority filter; policy drop;
    }

    chain salida {
        type filter hook output priority filter; policy accept;
    }
}
