# CI: format, vet, tests (race), cross-build for the node, vulnerabilities and leaks.
# Actions are pinned to full commit SHAs; Dependabot keeps them current.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        mod: [".", "00_verification/analysis"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ${{ matrix.mod }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.mod }}/go.mod
          check-latest: true
          cache: false
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: tidy
        run: go mod tidy -diff
      - name: test
        run: go test -race ./...
      - name: build for the node
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath ./...

  govulncheck:
    strategy:
      fail-fast: false
      matrix:
        mod: [".", "00_verification/analysis"]
    runs-on: ubuntu-24.04
    steps:
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          work-dir: ${{ matrix.mod }}
          go-version-file: ${{ matrix.mod }}/go.mod
          cache: false

  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
